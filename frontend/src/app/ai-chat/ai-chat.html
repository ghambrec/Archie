<section class="chat">
  <header class="chat-header">
    <h1>AI Chat</h1>
    <button type="button" class="btn btn-outline-secondary" disabled>
      New chat
    </button>
  </header>

  <div class="chat-messages" role="log" aria-label="Chat messages">
    <article class="message message-user">
      <strong>You</strong>
      <p>What documents are available?</p>
    </article>

    <article class="message message-ai">
      <strong>AI</strong>
      <p>You can ask me questions about your documents.</p>
    </article>
  </div>

  <div class="chat-status" role="status">
    <!-- Later: loading indicator or error message -->
  </div>

  <footer class="chat-composer">
    <label for="chat-question" class="visually-hidden">
      Your question
    </label>

    <textarea
      id="chat-question"
      class="form-control"
      rows="2"
      placeholder="Ask about your documents..."
      maxlength="100"
    ></textarea>
  <div class="d-flex gab-3">
    <button type="button" class="btn btn-primary" disabled>
      Send
    </button>

	  <button type="button" class="btn btn-secondary" disabled>
      Delete Chat 
    </button>

	  <button type="button" class="btn btn-secondary" disabled>
      Delete all Chats
    </button>
  </div>

  </footer>
</section>
