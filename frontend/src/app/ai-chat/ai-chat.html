<section class="chat">
  <header class="chat-header">
    <h1>AI Chat</h1>
    <button
      type="button"
      class="btn btn-outline-secondary"
      [disabled]="isCreatingConversation()"
      (click)="startNewChat()"
      ngbTooltip="Start a new conversation. Existing chats remain saved."
      >
      {{ 'ai-chat.botton.new_chat' | transloco }}
    </button>
      @if (createConversationError(); as errorKey) {
    <div class="alert alert-danger" role="alert">
      {{ errorKey | transloco }}
    </div>
    }


  </header>

  <div class="chat-messages" role="log" aria-label="Chat messages">
    @for (message of messages(); track message.id) {
    <article
      class="message"
      [class.message-user]="message.sender === 'user'"
      [class.message-ai]="message.sender === 'llm'"
    >
      <strong>
        {{ (message.sender === 'user'
          ? 'ai-chat.message.sender.user'
          : 'ai-chat.message.sender.llm') | transloco }}
      </strong>

  <p>{{ message.content }}</p>
</article>
    }
  </div>

  <div class="chat-status" role="status">
    <!-- Later: loading indicator or error message -->
  </div>

  <footer class="chat-composer">
    <label for="chat-question" class="visually-hidden">
      Your question
    </label>

    <textarea
      #questionInput
      id="chat-question"
      class="form-control"
      rows="2"
      placeholder="Ask about your documents..."
      maxlength="100"
      [value] = "draft()"
      (input) = draft.set(questionInput.value)
    ></textarea>
    
  <div class="d-flex gap-3">
    <button  
      type="button" 
      class="btn btn-primary"
      [disabled] = "!draft().trim()"
      (click)= "send()"
      >
        {{'ai-chat.botton.send' | transloco}}
    </button>

	  <button type="button" class="btn btn-secondary" disabled>
       {{'ai-chat.botton.Delete_chat' | transloco}}
    </button>

	  <button type="button" class="btn btn-secondary" disabled>
      {{'ai-chat.botton.Delete_all_chats' | transloco}}
    </button>
  </div>

  </footer>
</section>
