<section class="chat">
  <header class="chat-header">
    <h1>AI Chat</h1>
    <button type="button" class="btn btn-outline-secondary" disabled>
      New chat
    </button>
  </header>

  <div class="chat-messages" role="log" aria-label="Chat messages">
    @for (message of messages(); track message.id) {
      <article
      class="message"
      [class.message-user]="message.sender === 'user'"
      [class.message-ai]="message.sender === 'llm'"
    >
      <strong>{{ message.sender === 'user' ? 'You' : 'AI' }}</strong>
      <p>{{ message.content | transloco }}</p>
    </article>
    }
  </div>

  <div class="chat-status" role="status">
    <!-- Later: loading indicator or error message -->
  </div>

  <footer class="chat-composer">
    <label for="chat-question" class="visually-hidden">
      Your question
    </label>

    <textarea
      #questionInput
      id="chat-question"
      class="form-control"
      rows="2"
      placeholder="Ask about your documents..."
      maxlength="100"
      [value] = "draft()"
      (input) = draft.set(questionInput.value)
    ></textarea>
    
  <div class="d-flex gab-3">
    <button  
      type="button" 
      class="btn btn-primary"
      [disabled] = "!draft().trim()"
      (click)= "send()"
      >
        Send
    </button>

	  <button type="button" class="btn btn-secondary" disabled>
      Delete Chat 
    </button>

	  <button type="button" class="btn btn-secondary" disabled>
      Delete all Chats
    </button>
  </div>

  </footer>
</section>
