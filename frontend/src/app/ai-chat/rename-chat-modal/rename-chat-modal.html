<form novalidate (submit)="$event.preventDefault(); save()">
  <div class="modal-header">
    <h2 class="modal-title fs-5" id="rename-chat-heading">{{ 'ai-chat.renameModal.heading' | transloco }}</h2>
    <button type="button" class="btn-close" [disabled]="isSaving()"
      [attr.aria-label]="'ai-chat.renameModal.cancel' | transloco" (click)="activeModal.dismiss()"></button>
  </div>
  <div class="modal-body" [attr.aria-busy]="isSaving()">
    <label for="rename-chat-title" class="form-label">{{ 'ai-chat.renameModal.title' | transloco }}</label>
    <input #titleInput id="rename-chat-title" type="text" class="form-control" ngbAutofocus required
      [value]="title()" [disabled]="isSaving()"
      (input)="title.set(titleInput.value)" (blur)="touched.set(true)"
      [class.is-invalid]="touched() && validationError() !== null"
      [attr.aria-invalid]="touched() && validationError() !== null"
      [attr.aria-describedby]="touched() && validationError() ? 'rename-chat-validation' : null">
    @if (touched()) {
      @if (validationError(); as error) {
        <div id="rename-chat-validation" class="invalid-feedback" role="alert">
          {{ error | transloco }}
        </div>
      }
    }
    @if (errorKey(); as error) {
      <div class="alert alert-danger mt-3" role="alert">{{ error | transloco }}</div>
    }
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" [disabled]="isSaving()" (click)="activeModal.dismiss()">
      {{ 'ai-chat.renameModal.cancel' | transloco }}
    </button>
    <button type="submit" class="btn btn-primary" [disabled]="isSaving()">
      {{ (isSaving() ? 'ai-chat.renameModal.saving' : 'ai-chat.renameModal.save') | transloco }}
    </button>
  </div>
</form>
