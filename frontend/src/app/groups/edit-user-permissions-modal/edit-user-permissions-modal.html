<div class="modal-header">
  <h5 class="modal-title">
    {{ "groups.userPermissions.heading" | transloco }}
  </h5>

  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="activeModal.dismiss()">
  </button>
</div>

<div class="modal-body">
  <p>
    {{ "groups.userPermissions.permissionsOf" | transloco: {
      userName: selectedUser.displayName
    } }}
  </p>

  @for (permission of availablePermissions; track permission.key) {
	<div class="form-check">
	<input
		[id]="permission.key"
		type="checkbox"
		class="form-check-input"
		[checked]="hasPermission(permission.key)"
		(change)="setPermission(permission.key, $event)">

	<label [for]="permission.key" class="form-check-label">
		{{ permission.label| transloco }}
	</label>
	</div>
  }

<div class="modal-footer">
  <button
    type="button"
    class="btn btn-secondary"
    (click)="activeModal.dismiss()">
    {{ "groups.userPermissions.btnCancel" | transloco }}
  </button>

  <button
    type="button"
    class="btn btn-primary"
    (click)="save()">
    {{ "groups.userPermissions.btnSave" | transloco }}
  </button>
</div>
