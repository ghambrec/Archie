<div class="modal-header">
	<h5 class="modal-title">{{ "groups.editGroupAdmin.heading" | transloco }}</h5>
	<button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="activeModal.dismiss()">
  </button>
</div>

<div class="modal-body">
	<form [formRoot]="editGroupAdminForm">

		<div class="mb-3">
			<label class="form-label">
        {{ "groups.editGroupAdmin.name" | transloco }}
      </label>
			<input
        type="text"
        class="form-control"
				[formField]="editGroupAdminForm.name" />
		</div>

		<div class="mb-3">
			<label class="form-label">
        {{ "groups.editGroupAdmin.description" | transloco }}
      </label>
      <textarea
        class="form-control"
        [formField]="editGroupAdminForm.description">
      </textarea>
    </div>
		@if (editGroupAdminForm().errors().length > 0) {
		  <div class="text-danger">
        {{ editGroupAdminForm().errors()[0].message | transloco }}
      </div>
		}

		@if (feedbackMsg()) {
		  <div class="text-success">
        {{ feedbackMsg() | transloco }}
      </div>
		}

		<div class="d-flex justify-content-between">
			<button
        type="button"
        class="btn btn-secondary"
        (click)="activeModal.dismiss()">
        {{ "groups.editGroupAdmin.btnCancel" | transloco }}
      </button>
			
			<button
        type="submit"
        class="btn btn-primary"
        [disabled]="editGroupAdminForm().submitting()">
				@if (editGroupAdminForm().submitting()) {
          {{ "groups.editGroupAdmin.btnSubmitPending" | transloco }}
        } @else {
          {{ "groups.editGroupAdmin.btnSubmit" | transloco }}
        }
			</button>
		</div>

	</form>
</div>
