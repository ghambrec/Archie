@if (hasLoadError()) {
	<p class="text-danger"> 
	{{ 'groups.groupList.errorLoading' | transloco}}
	</p>
}	@else {
	<table class="table">
		<thead>
			<tr> {{ groups.groupList.name | transloco }}</tr>
			<tr> {{ groups.groupList.description | transloco }}</tr>
		</thead>

	<tbody>
		@for (group of groupsService.groupsList(); track group.id) {
		<tr> 
			<td> {{ group.name }} </td>
			<td> {{ group.description ?? '-'}}</td>
		</tr>
	}
	</tbody>
	</table>
}
