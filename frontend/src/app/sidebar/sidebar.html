<div class="d-flex flex-column flex-shrink-0 p-3 bg-light h-100 overflow-x-hidden" style="width: 280px;">
	<a routerLink="/documents" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-decoration-none">
		<img src="images/logo.png" [alt]="'programName' | transloco" height="50">
	</a>
	<hr>
	<ul class="nav nav-pills flex-column">

		<app-doc-upload></app-doc-upload>

		<!-- documents -->
		<li>
			<a routerLink="/documents" class="nav-link" routerLinkActive="active">
				<i class="bi bi-file-earmark-text-fill me-2"></i>
				{{ "sidebar.documents" | transloco }}
			</a>
		</li>

		<!-- settings -->
		@if (usersService.isAdminUser()) {
		<li>
			<a routerLink="/settings" class="nav-link" routerLinkActive="active">
				<i class="bi bi-gear-fill me-2"></i>
				{{ "sidebar.settings" | transloco }}
			</a>
		</li>
		}
	</ul>
	<hr>
	<app-tag-tree class="flex-grow-1 overflow-y-auto px-1"></app-tag-tree>
	<hr>
	<app-chat-sidebar />
	<hr>
	<div class="dropdown" ngbDropdown>
		<a href="#" class="d-flex align-items-center link-dark text-decoration-none dropdown-toggle" id="dropdownUser2" ngbDropdownToggle (click)="$event.preventDefault()">
			<img [src]="usersService.getAvatarUrl(usersService.currentUser()?.id)" alt="" width="32" height="32" class="rounded-circle me-2">
			<strong>{{ usersService.currentUser()?.displayName }}</strong>
		</a>
		<ul class="dropdown-menu text-small shadow" aria-labelledby="dropdownUser2" ngbDropdownMenu>
			<li><a class="dropdown-item" ngbDropdownItem routerLink="/profile">{{ "sidebar.dropdown.profile" | transloco }}</a></li>
			<li>
				<hr class="dropdown-divider">
			</li>
			<li><a class="dropdown-item" ngbDropdownItem href="#" (click)="$event.preventDefault(); logout()">{{ "sidebar.dropdown.logOut" | transloco }}</a></li>
		</ul>
	</div>
</div>
