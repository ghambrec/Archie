<div class="d-flex align-items-center justify-content-center vh-100 bg-light">
	<div class="card p-4" style="width: 320px;">
			<h1 class="h4 mb-3 text-center">{{ 'login.title' | transloco }}</h1>

			<div class="mb-3">
					<label class="form-label">{{ 'login.email' | transloco }}</label>
					<input type="email" class="form-control" />          
			</div>

			<div class="mb-3">
					<label class="form-label">{{ 'login.password' | transloco }}</label>
					<input type="password" class="form-control" />
			</div>

			<button type="submit" class="btn btn-primary w-100">{{ 'login.submit' | transloco }}</button>
	</div>
</div>
