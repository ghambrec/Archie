<h1>{{ 'users.userList.heading' | transloco }}</h1>
<ul class="nav nav-tabs mb-3">
  <li class="nav-item">
    <button type="button" class="nav-link" [class.active]="!showDeleted()"
      [attr.aria-pressed]="!showDeleted()" (click)="showDeleted.set(false)">
      {{ 'users.userList.tabs.users' | transloco }}
    </button>
  </li>
  <li class="nav-item">
    <button type="button" class="nav-link" [class.active]="showDeleted()"
      [attr.aria-pressed]="showDeleted()" (click)="showDeleted.set(true)">
      {{ 'users.userList.tabs.deleted' | transloco }}
    </button>
  </li>
</ul>
<input type="search" class="form-control mb-1"
  [attr.aria-label]="'users.userList.searchPlaceholder' | transloco"
  [placeholder]="'users.userList.searchPlaceholder' | transloco"
  [value]="searchString()" (input)="searchString.set($event.target.value)" />
@if (isLoadingList()) {
  <p role="status">{{ 'users.userList.loading' | transloco }}</p>
}
@if (listError()) {
  <div class="alert alert-danger" role="alert">
    <p>{{ (showDeleted() ? 'users.userList.deletedLoadError' : 'users.userList.loadError') | transloco }}</p>
    <button type="button" class="btn btn-sm btn-outline-danger" (click)="reloadDisplayedList()">
      {{ 'users.userList.retry' | transloco }}
    </button>
  </div>
}
@if (showDeleted()) {
  <app-deleted-user-list
    [users]="filteredUserList()"
    [showEmpty]="!isLoadingList() && !listError()"
    (restoreRequested)="openRestoreUserModal($event)" />
} @else {
  <app-user-table
    [users]="filteredUserList()"
    [avatarUrl]="userAvatarUrl"
    [showEmpty]="!isLoadingList() && !listError()"
    (createRequested)="openCreateUserModal()"
    (infoRequested)="openUserInfoModal($event)"
    (editRequested)="openEditUserModal($event)"
    (deleteRequested)="openDeleteUserModal($event)" />
}
