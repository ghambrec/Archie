<div class="modal-header">
  <h5 class="modal-title">{{ 'users.createUser.heading' | transloco }}</h5>
  <button type="button" class="btn-close"
    [attr.aria-label]="'users.createUser.btnCancel' | transloco"
    [disabled]="createUserForm().submitting()" (click)="activeModal.dismiss()"></button>
</div>

<div class="modal-body">
  <form [formRoot]="createUserForm">
    <fieldset [disabled]="createUserForm().submitting()">
      <app-form-field inputId="create-email" type="email" autocomplete="email"
        labelKey="users.createUser.email" [field]="createUserForm.email" />
      <app-form-field inputId="create-password" type="password" autocomplete="new-password"
        labelKey="users.createUser.password" [field]="createUserForm.password" />
      <app-form-field inputId="create-displayName" autocomplete="nickname"
        labelKey="users.createUser.name" [field]="createUserForm.displayName" />

      @if (createUserForm().errors()[0]?.message; as errorKey) {
        <div class="alert alert-danger" role="alert">{{ errorKey | transloco }}</div>
      }
      @if (feedbackMsg(); as messageKey) {
        <div class="text-success" role="status">{{ messageKey | transloco }}</div>
      }

      <div class="d-flex justify-content-between">
        <button type="button" class="btn btn-secondary" (click)="activeModal.dismiss()">
          {{ 'users.createUser.btnCancel' | transloco }}
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="createUserForm().submitting()">
          {{ (createUserForm().submitting() ? 'users.createUser.btnSubmitPending' : 'users.createUser.btnSubmit') | transloco }}
        </button>
      </div>
    </fieldset>
  </form>
</div>
