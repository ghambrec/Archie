<div class="modal-header">
  <h5 class="modal-title">{{ 'users.updateUser.heading' | transloco }}</h5>
  <button type="button" class="btn-close"
    [attr.aria-label]="'users.updateUser.btnClose' | transloco"
    [disabled]="editUserForm().submitting()" (click)="activeModal.dismiss()"></button>
</div>

<div class="modal-body">
  <form [formRoot]="editUserForm">
    <fieldset [disabled]="editUserForm().submitting()">
      <app-form-field inputId="edit-email" type="email" autocomplete="email"
        labelKey="users.updateUser.email" [field]="editUserForm.email" />
      <app-form-field inputId="edit-displayName" autocomplete="nickname"
        labelKey="users.updateUser.displayName" [field]="editUserForm.displayName" />
      <app-form-field inputId="edit-language" labelKey="users.updateUser.preferredLanguage"
        hintKey="users.updateUser.languageHint" [field]="editUserForm.preferredLanguage" />
      <app-form-field inputId="edit-password" type="password" autocomplete="new-password"
        labelKey="users.updateUser.password" [field]="editUserForm.password" />

      @if (editUserForm().errors()[0]?.message; as errorKey) {
        <div class="alert alert-danger" role="alert">{{ errorKey | transloco }}</div>
      }

      <div class="d-flex justify-content-between">
        <button type="button" class="btn btn-secondary" (click)="activeModal.dismiss()">
          {{ 'users.updateUser.btnClose' | transloco }}
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="editUserForm().submitting()">
          {{ (editUserForm().submitting() ? 'users.updateUser.btnSubmitPending' : 'users.updateUser.btnSubmit') | transloco }}
        </button>
      </div>
    </fieldset>
  </form>
</div>
