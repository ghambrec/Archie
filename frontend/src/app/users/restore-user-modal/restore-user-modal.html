<div class="modal-header">
  <h2 class="modal-title fs-5" id="restore-user-title">{{ 'users.restoreUser.heading' | transloco }}</h2>
  <button type="button" class="btn-close" [disabled]="isRestoring()"
    [attr.aria-label]="'users.restoreUser.cancel' | transloco" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body" id="restore-user-description" [attr.aria-busy]="isRestoring()">
  <p>{{ 'users.restoreUser.question' | transloco }}</p>
  <p class="text-break"><strong>{{ selectedUser.displayName }}</strong><br>{{ selectedUser.email }}</p>
  <p>{{ 'users.restoreUser.description' | transloco }}</p>
  @if (errorKey(); as error) {
    <div class="alert alert-danger" role="alert">{{ error | transloco }}</div>
  }
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-secondary" ngbAutofocus [disabled]="isRestoring()"
    (click)="activeModal.dismiss()">{{ 'users.restoreUser.cancel' | transloco }}</button>
  <button type="button" class="btn btn-primary" [disabled]="isRestoring()" (click)="confirmRestore()">
    {{ (isRestoring() ? 'users.restoreUser.restoring' : 'users.restoreUser.confirm') | transloco }}
  </button>
</div>
