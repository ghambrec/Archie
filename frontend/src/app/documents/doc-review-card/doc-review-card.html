<div class="card h-100 shadow-sm">
	<div class="card-header bg-transparent d-flex align-items-center gap-2">
		<i class="bi bi-file-earmark-text text-secondary"></i>
		<span class="fw-semibold text-truncate flex-grow-1" [ngbTooltip]="doc().filename" container="body" [openDelay]="400">{{ doc().filename }}</span>
		<app-doc-status-badge [status]="doc().aiStatus" />
	</div>

	<div class="card-body">
		@if (isProcessing()) {
			<span class="text-muted small">{{ "documents.review.suggestionsPending" | transloco }}</span>
		} @else {
			<div class="d-flex flex-wrap gap-2 align-items-center">
				@for (s of doc().suggestions; track s.tagId) {
					<button type="button" class="tag-chip"
						[class.selected]="selectedTags().has(s.tagId)"
						(click)="toggleTag(s.tagId)">
						{{ s.label | transloco }}
						<span class="tag-chip-confidence">{{ s.confidence | percent }}</span>
					</button>
				}
				@for (tag of addedTags(); track tag.id) {
					<button type="button" class="tag-chip selected" (click)="removeTag(tag.id)">
						{{ tag.label | transloco }}
						<i class="bi bi-x"></i>
					</button>
				}
				<app-tag-picker [excludeIds]="usedTagIds()" (picked)="addTag($event)" />
			</div>
		}
	</div>

	<div class="card-footer bg-transparent d-flex justify-content-end gap-2">
		@if (canRetry()) {
			<button type="button" class="btn btn-sm btn-outline-secondary"
				[ngbTooltip]="'documents.review.btnRetry' | transloco"
				[disabled]="busy()" (click)="retry.emit()">
				<i class="bi bi-arrow-clockwise"></i>
			</button>
		}
		<button type="button" class="btn btn-sm btn-success"
			[ngbTooltip]="'documents.review.btnConfirm' | transloco"
			[disabled]="isProcessing() || busy()" (click)="onConfirm()">
			<i class="bi bi-check-lg"></i>
		</button>
	</div>
</div>
