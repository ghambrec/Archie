@if (uploadGroups.hasValue() && uploadGroups.value().length > 0) {
<div
	class="upload-zone"
	[class.dragging]="isInDragZone()"
	[class.no-group]="!selectedGroupId()"
	(dragover)="onDragIn($event)"
	(dragleave)="onDragOut($event)"
	(drop)="onDrop($event)"
>
	<div class="input-group mb-2">
		<span
				class="input-group-text"
				[ngbTooltip]="'documents.upload.selectGroupTooltip' | transloco"
				placement="bottom"
		>
				<i class="bi bi-people" aria-hidden="true"></i>
		</span>
		<select
				class="form-select"
				(change)="onGroupChange($event)"
		>
				<option value="" disabled selected></option>
				@for (group of uploadGroups.value(); track group.id) {
						<option [value]="group.id">{{ group.name }}</option>
				}
		</select>
	</div>

	<button
		type="button"
		class="btn btn-primary w-100 d-flex flex-column align-items-center p-3 mb-1"
		[disabled]="!selectedGroupId()"
		(click)="openFilePicker()"
	>
		<span class="d-flex align-items-center gap-2">
				<i class="bi bi-plus-lg"></i>
				{{ 'documents.upload.upload' | transloco }}
		</span>
		@if (maxSizeMb(); as size) {
				<small class="upload-hint">{{ 'documents.upload.maxSize' | transloco: { size: size } }}</small>
		}
	</button>

	<input
		#fileInput
		type="file"
		multiple
		class="visually-hidden"
		[attr.accept]="uploadConfig.value()?.allowedExtensions?.join(',')"
		(change)="onFilesSelected($event)"
	>

<!-- progress for uploading docs -->
@for (task of uploads(); track task.id) {
	<div class="d-flex align-items-center gap-2 mt-2 rounded bg-white border w-100 p-3 mb-3">
			<div class="flex-grow-1 upload-task-name">
					<div class="text-truncate" [ngbTooltip]="task.filename" placement="bottom">
							{{ task.filename }}
					</div>

					@if (task.status === 'uploading') {
							<div class="progress mt-1" style="height: 4px;"
									role="progressbar"
									[attr.aria-valuenow]="task.progress"
									aria-valuemin="0"
									aria-valuemax="100"
									[attr.aria-label]="task.filename">
									<div class="progress-bar" [style.width.%]="task.progress"></div>
							</div>
					} @else if (task.status === 'error') {
							<small class="text-danger">{{ task.errorKey! | transloco }}</small>
					}
			</div>

			@if (task.status === 'done') {
					<i class="bi bi-check-circle-fill text-success"></i>
			} @else {
					<button type="button" class="btn-close"
							(click)="cancelTask(task.id)"></button>
			}
	</div>
}

</div>
}
