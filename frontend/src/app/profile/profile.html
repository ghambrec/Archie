<div class="container-fluid py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-xl-9">
        
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1 class="h3 mb-1">
            {{ 'profile.heading' | transloco }}
          </h1>
          <p>
            {{ 'profile.description' | transloco }}
          </p>
        </div>

        <span
          class="badge"
          [class.text-bg-success]="profile().isActive"
          [class.text-bg-secondary]="!profile().isActive">
          {{ profile().isActive
            ? ('profile.active' | transloco)
            : ('profile.inactive' | transloco)
          }}
        </span>
      </div>

      <ul ngbNav #nav="ngbNav" class="nav-tabs mb-4">
        <li [ngbNavItem]="1">
          <button ngbNavLink>
            {{ 'profile.tabs.profile' | transloco }}
          </button>

          <ng-template ngbNavContent>
            <app-profile-edit-form
              [profile]="profile()"
              [avatarUrl]="avatarUrl"
              (avatarError)="onAvatarError($event)" />

            <app-profile-groups [userGroups]="userGroups()" />

          </ng-template>
        </li>

        <li [ngbNavItem]="2">
          <button ngbNavLink>
            {{ 'profile.tabs.security' | transloco }}
          </button>

          <ng-template ngbNavContent>
            <app-profile-security
              [(editPassword)]="editPassword"
              [isPasswordSaving]="isPasswordSaving()"
              [passwordSaveMessage]="passwordSaveMessage()"
              [passwordSaveError]="passwordSaveError()"
              (saveRequested)="savePassword()" />
          </ng-template>
        </li>

      </ul>
      
      <div [ngbNavOutlet]="nav"></div>
    </div>
  </div>
</div>
