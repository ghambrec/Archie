  nest-server:
    build:
      context: ./backend/nest-server
      dockerfile: Dockerfile
    container_name: nest-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./backend/nest-server:/app
      - nest-server-node-modules:/app/node_modules
    networks:
      - archie
    env_file: "./env/.env"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true


networks:
  archie:
    driver: bridge

volumes:
  redis-data:
  postgres_data:
  minio_data:
  nest-server-node-modules:
