services:
  backend:
    image: node:22-alpine
    container_name: archie-backend
    working_dir: /app
    command: >
      sh -c "corepack enable && pnpm install && pnpm run start:dev"
    volumes:
      - ./backend/nest-server:/app
      - backend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    container_name: archie-frontend
    working_dir: /app
    command: >
      sh -c "corepack enable &&
           pnpm install &&
           pnpm start --host 0.0.0.0 --port 4200"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      - backend
    environment:
      NODE_ENV: development
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg18
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backend/postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: pgsty/minio:RELEASE.2026-06-18T00-00-00Z
    container_name: minio
    restart: unless-stopped
    ports:
    - "9000:9000" # s3-api
    - "9001:9001" # web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: pgsty/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/documents &&
      mc mb --ignore-existing local/avatars &&
      (mc admin user add local \"$$MINIO_APP_ACCESS_KEY\" \"$$MINIO_APP_SECRET_KEY\" || true) &&
      (mc admin policy attach local readwrite --user=\"$$MINIO_APP_ACCESS_KEY\" || true) &&
      echo 'MinIO init done.'
      "

volumes:
  backend_node_modules:
  frontend_node_modules:
  postgres_data:
  minio_data:
