services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - ./env/.env
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - archie


  redis:
    image: redis:latest
    container_name: redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - archie

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - archie
    depends_on:
      postgres:
        condition: service_healthy

  minio:
   image: pgsty/minio:RELEASE.2026-06-18T00-00-00Z
   container_name: minio
   restart: unless-stopped
   env_file: "./env/.env"
   command: server /data --console-address ":9001"
   ports:
    - "9000:9000"
    - "9001:9001"
   volumes:
     - minio_data:/data
   healthcheck:
     test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
     interval: 30s
     timeout: 5s
     retries: 5
     start_period: 10s
   networks:
     - archie


  minio-init:
   image: pgsty/mc:latest
   container_name: minio-init
   depends_on:
     minio:
       condition: service_healthy
   restart: "no"
   env_file: "./env/.env"
   entrypoint: >
     /bin/sh -c "
     mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
     mc mb --ignore-existing local/documents &&
     mc mb --ignore-existing local/avatars &&
     (mc admin user add local \"$$MINIO_APP_ACCESS_KEY\" \"$$MINIO_APP_SECRET_KEY\" || true) &&
     (mc admin policy attach local readwrite --user=\"$$MINIO_APP_ACCESS_KEY\" || true) &&
     echo 'MinIO init done.'
     "
   networks:
     - archie

  ai-service:
   build:
     context: ./backend/ai-service
     dockerfile: Dockerfile
   container_name: ai-service
   restart: unless-stopped
   ports:
     - "5001:5001"
   volumes:
     - ./backend/ai-service:/app
   networks:
     - archie
   env_file: "./env/.env"
   depends_on:
     postgres:
       condition: service_healthy
     minio:
       condition: service_healthy

  nest-server:
   build:
     context: ./backend/nest-server
     dockerfile: Dockerfile
   container_name: nest-server
   restart: unless-stopped
   ports:
     - "3000:3000"
   volumes:
     - ./backend/nest-server:/app
     - nest-server-node-modules:/app/node_modules
   networks:
     - archie
   env_file: "./env/.env"
   depends_on:
     postgres:
       condition: service_healthy
       restart: true
     redis:
       condition: service_healthy
       restart: true
     ai-service:
       condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    networks:
      - archie
    depends_on:
      - nest-server

networks:
  archie:
    driver: bridge

volumes:
  redis-data:
  postgres_data:
  minio_data:
  nest-server-node-modules:
  frontend-node-modules:
