name: Tests Nest-Server
run-name: ${{ github.actor }} is testing out backend 🚀
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/github-actions-backend.yml'

jobs:
  Test-Backend: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up backend pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: backend/nest-server/package.json
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: "pnpm"
          cache-dependency-path: backend/nest-server/pnpm-lock.yaml 

      - name: install nest-server dependencies
        run: make deps-nest

      - name: build nest-server
        run: make build-nest

      # - name: run nest-server unit tests
      #   run: cd backend/nest-server && pnpm test

  Integration-Test:
    needs: [Test-Backend]
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgresdb_test
      POSTGRES_PORT: 5432
      POSTGRES_HOST: localhost
      NEST_SERVER_PORT: 3000
      NODE_ENV: test
      APP_PUBLIC_URL: http://localhost:3000
      REDIS_URL: redis://localhost:6379
      SESSION_TTL_SECONDS: 604800
      SESSION_COOKIE_NAME: session_id
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 9000
      MINIO_USE_SSL: false
      AUTH_MAX_LOGIN_ATTEMPTS: 5
      AUTH_LOGIN_LOCKOUT_SECONDS: 900
      AI_SERVICE_HOST: ai-service-test
      AI_SERVICE_PORT: 5001
      AI_SERVICE_API_KEY: test-ai-service-key

    services:
      postgres-test:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgresdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgresdb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis-test:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      minio-test:
        image: bitnamilegacy/minio:latest
        env:
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          MINIO_APP_ACCESS_KEY: ${{ secrets.MINIO_APP_ACCESS_KEY }}
          MINIO_APP_SECRET_KEY: ${{ secrets.MINIO_APP_SECRET_KEY }}
          MINIO_DEFAULT_BUCKETS: documents,avatars
        ports:
          - 9000:9000
          - 9001:9001
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 5s

    steps:
      - uses: actions/checkout@v6

      - name: Set up backend pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: backend/nest-server/package.json
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: "pnpm"
          cache-dependency-path: backend/nest-server/pnpm-lock.yaml

      - name: install nest-server dependencies
        run: make deps-nest

      - name: run database migrations
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_USER_PASSWORD: ${{ secrets.ADMIN_USER_PASSWORD }}
        run: cd backend/nest-server && pnpm run migration:run

      - name: run nest-server integration/e2e tests
        env:
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          MINIO_APP_ACCESS_KEY: ${{ secrets.MINIO_APP_ACCESS_KEY }}
          MINIO_APP_SECRET_KEY: ${{ secrets.MINIO_APP_SECRET_KEY }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_USER_PASSWORD: ${{ secrets.ADMIN_USER_PASSWORD }}
      
        run: cd backend/nest-server && pnpm run test:e2e
